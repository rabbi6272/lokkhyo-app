name: CI

on:
  push:
    branches: [ rabbi, main ]
  pull_request:
    branches: [ rabbi, main ]

jobs:
  app-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck + lint
        run: yarn check:errors
      - name: Unit tests
        run: yarn test
